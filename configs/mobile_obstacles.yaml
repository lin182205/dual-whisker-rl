# 移动触须 + 二维雷达的最小障碍闭环示例。
# 使用此配置会把 12 维雷达拼入策略观测，因此应从新模型开始训练。
scenario_mode: fixed
source_position: [-1.8, 0.0]
world_half: 2.0

obstacles:
  # 中央竖墙：阻断直线路径，但上下均留有可绕行空间。
  - [-0.10, 0.20, -0.90, 0.90]
  # 上风侧附加障碍：用于验证侧向雷达束和二次绕行。
  - [-1.04, -0.64, 0.64, 1.16]

# D2Q9 LBM 只在 reset 时按平均风向求解稳态场；同一几何和10°风向档位会复用缓存。
obstacle_flow:
  enabled: true
  method: lbm_d2q9
  mode: steady
  resolution: 129
  direction_bin_deg: 10.0
  padding_cells: 12
  lattice_speed: 0.04
  relaxation_time: 0.60
  convergence_tolerance: 1.0e-5
  max_iterations: 2500
  averaging_iterations: 400
  wake_turbulence_gain: 1.5
  wall_transmission: 0.0
  max_cfl_fraction: 0.5

lidar_num_beams: 12
lidar_fov_deg: 180.0
lidar_max_range: 0.6
lidar_noise_std: 0.0
include_lidar_observation: true

robot_radius: 0.20
oob_penalty: 35.0
collision_penalty: 35.0
