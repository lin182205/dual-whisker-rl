  - no_reacquisition_reward
  - no_best_reward
  - no_stagnation
  - sparse_reward
  geometry:
  - main
  - length0
  - length075
  - length225
  - sectors3
  - sectors5
  - sectors15
  sensor:
  - ideal_sensor
  - ideal_mlp
  - nominal_gru
  - nominal_mlp
  - tau_half
  - tau_one_half
  randomization:
  - main
  - with_dr
  - dr_narrow
  - dr_wide
