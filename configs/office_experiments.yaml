    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
      progress_reward_scale: 0.0
      best_concentration_reward_scale: 0.0
      whisker_reacquisition_bonus: 0.0
      stagnation_penalty: 0.0
      mobile_time_penalty: 0.0
  length0:
