    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
      sensor_response_tau: 0.3
      sensor_recovery_tau: 1.5
  tau_one_half:
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
      sensor_response_tau: 0.9
      sensor_recovery_tau: 4.5
  dr_narrow:
    history_length: 20
    encoder: gru
    dr_spread: 0.5
    config:
      domain_randomization: true
  dr_wide:
    history_length: 20
    encoder: gru
    dr_spread: 2.0
    config:
      domain_randomization: true
  with_dr:
    method: main
    history_length: 20
    encoder: gru
    config:
      domain_randomization: true
