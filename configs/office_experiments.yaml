    encoder: gru
    config:
      domain_randomization: false
      whisker_sector_count: 5
  sectors15:
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
      whisker_sector_count: 15
  ideal_sensor:
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
      sensor_response_tau: 0.0
      sensor_recovery_tau: 0.0
      sensor_noise_std: 0.0
  ideal_mlp:
    history_length: 20
    encoder: mlp
    config:
      domain_randomization: false
      sensor_response_tau: 0.0
      sensor_recovery_tau: 0.0
      sensor_noise_std: 0.0
