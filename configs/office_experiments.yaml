  core:
  - main
  - fixed
  - periodic
  - single_frame
  - history_mlp
  - single_left
  - single_right
  history:
  - main
  - h1
  - h5
  - h10
  - h40
  - history_mlp
  features:
  - main
  - no_trend
  - no_difference
  - no_blank_age
  - no_angles
  - raw_only
  - current_wind_only
  - no_motion_history
  - no_absolute_xy
  rewards:
