# 办公图批量对比，旧协议保留在red_experiments.yaml。
scope: simulation_only
base_config: configs/mobile_rooms_hybrid_history.yaml
selection: success_then_penalized_time
profiles:
  smoke:
    seeds:
    - 11
    timesteps: 64
    n_envs: 1
    n_steps: 16
    batch_size: 16
    eval_every: 64
    validation_scenarios: 1
    test_scenarios: 2
    max_steps: 1200
    device: cpu
    backend: dummy
    save_step_logs: true
  formal:
    seeds:
    - 1
    - 2
    - 3
    - 4
    - 5
    timesteps: 2000000
    n_envs: 8
    n_steps: 512
    batch_size: 256
    eval_every: 50000
    validation_scenarios: 200
    test_scenarios: 648
    max_steps: 1200
    device: auto
    backend: subproc
    save_step_logs: true
common:
  success_hold_s: 0.0
  dt: 0.2
  reacquisition_min_blank_s: 1.0
variants:
  main:
    method: main
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
  fixed:
    method: b2_fixed
    history_length: 20
    encoder: gru
    fixed_sector: 5
    config:
      domain_randomization: false
  periodic:
    method: b3_scan
    history_length: 20
    encoder: gru
    scan_hold: 2
    config:
      domain_randomization: false
  single_frame:
    method: b4_single_frame
    history_length: 1
    encoder: mlp
    config:
      domain_randomization: false
  history_mlp:
    method: b5_history_mlp
    history_length: 20
    encoder: mlp
    config:
      domain_randomization: false
  current_wind_only:
    method: main
    history_length: 20
    encoder: gru
    config:
      history_ablation: current_wind_only
  no_motion_history:
    method: main
    history_length: 20
    encoder: gru
    config:
      history_ablation: no_motion_history
  no_absolute_xy:
    method: main
    history_length: 20
    encoder: gru
    config:
      history_ablation: no_absolute_xy
  single_left:
    method: b6_left
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
  single_right:
    method: b6_right
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
  no_dr:
    method: main
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
  h1:
    history_length: 1
    encoder: gru
    config:
      domain_randomization: false
  h5:
    history_length: 5
    encoder: gru
    config:
      domain_randomization: false
  h10:
    history_length: 10
    encoder: gru
    config:
      domain_randomization: false
  h40:
    history_length: 40
    encoder: gru
    config:
      domain_randomization: false
  no_trend:
    history_length: 20
    encoder: gru
    feature_mask: no_trend
    config:
      domain_randomization: false
  no_difference:
    history_length: 20
    encoder: gru
    feature_mask: no_difference
    config:
      domain_randomization: false
  no_blank_age:
    history_length: 20
    encoder: gru
    feature_mask: no_blank_age
    config:
      domain_randomization: false
  no_angles:
    history_length: 20
    encoder: gru
    feature_mask: no_angles
    config:
      domain_randomization: false
  raw_only:
    history_length: 20
    encoder: gru
    feature_mask: raw_only
    config:
      domain_randomization: false
  no_reacquisition_reward:
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
      whisker_reacquisition_bonus: 0.0
  no_best_reward:
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
      best_concentration_reward_scale: 0.0
  no_stagnation:
    history_length: 20
    encoder: gru
    config:
      domain_randomization: false
      stagnation_penalty: 0.0
