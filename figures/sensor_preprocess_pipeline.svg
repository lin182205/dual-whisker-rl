<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1000" viewBox="0 0 1340 1000" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',SimHei,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444444"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#B5524F"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9A9A9A"/>
    </marker>
    <style>
      .box   { stroke-width:2; rx:10; }
      .lbl   { fill:#222; text-anchor:middle; }
      .sub   { font-size:68%; baseline-shift:sub; }
      .title { fill:#111; font-weight:bold; font-size:21px; }
      .small { fill:#777; text-anchor:middle; font-size:13px; }
      .flow  { fill:none; stroke:#444444; stroke-width:2.2; }
      .gate  { fill:none; stroke:#B5524F; stroke-width:2; stroke-dasharray:7 5; }
      .byp   { fill:none; stroke:#9A9A9A; stroke-width:1.8; stroke-dasharray:7 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1340" height="1000" fill="#ffffff"/>

  <!-- ===================== 面板 A ===================== -->
  <text x="24" y="40" class="title">(a) 单个 MQ-3 传感器在线预处理流程</text>

  <!-- 旁路：signal 直接送入归一化 -->
  <path class="flow" d="M360,195 L360,95 L1140,95 L1140,120" marker-end="url(#arrow)"/>
  <text x="760" y="86" class="small">s<tspan class="sub">t</tspan> 直接送入归一化</text>

  <!-- 主链箭头 -->
  <path class="flow" d="M195,240 L275,240" marker-end="url(#arrow)"/>
  <path class="flow" d="M445,240 L515,240" marker-end="url(#arrow)"/>
  <path class="flow" d="M685,240 C740,190 745,150 790,140" marker-end="url(#arrow)"/>
  <path class="flow" d="M685,240 C740,290 745,330 790,340" marker-end="url(#arrow)"/>
  <!-- 平滑/趋势/一阶 -> 归一化 -->
  <path class="flow" d="M970,140 C1010,150 1020,170 1060,200" marker-end="url(#arrow)"/>
  <path class="flow" d="M970,340 C1010,330 1020,310 1060,280" marker-end="url(#arrow)"/>
  <path class="flow" d="M600,195 L600,150 L1060,150 L1060,225" marker-end="url(#arrow)"/>
  <!-- 归一化 -> 特征向量 -->
  <path class="flow" d="M1140,360 L1140,427" marker-end="url(#arrow)"/>

  <!-- 基线门控反馈 -->
  <path class="gate" d="M600,285 C560,360 480,360 470,385" marker-end="url(#arrowR)"/>
  <path class="gate" d="M340,385 L340,285" marker-end="url(#arrowR)"/>
  <text x="700" y="395" fill="#B5524F" font-size="13px">气味刺激时</text>
  <text x="700" y="413" fill="#B5524F" font-size="13px">自动冻结基线</text>

  <!-- 方框 -->
  <rect class="box" x="45"  y="200" width="150" height="80"  fill="#E8EEF6" stroke="#3B6EA5"/>
  <rect class="box" x="275" y="195" width="170" height="90"  fill="#FBF0DC" stroke="#C9952B"/>
  <rect class="box" x="515" y="195" width="170" height="90"  fill="#FBF0DC" stroke="#C9952B"/>
  <rect class="box" x="790" y="97"  width="180" height="86"  fill="#FBF0DC" stroke="#C9952B"/>
  <rect class="box" x="790" y="297" width="180" height="86"  fill="#FBF0DC" stroke="#C9952B"/>
  <rect class="box" x="1060" y="120" width="160" height="240" fill="#E6F2E6" stroke="#4E8C53"/>
  <rect class="box" x="1040" y="427" width="200" height="86"  fill="#E6F2E6" stroke="#4E8C53"/>
  <rect class="box" x="195" y="385" width="330" height="110" fill="#F6E3E3" stroke="#B5524F"/>

  <!-- 文本 -->
  <text class="lbl" x="120" y="234" font-weight="bold" font-size="16px">原始 ADC</text>
  <text class="lbl" x="120" y="258" font-size="15px" font-style="italic">x<tspan class="sub">t</tspan></text>

  <text class="lbl" x="360" y="234" font-size="15px">去基线</text>
  <text class="lbl" x="360" y="258" font-size="15px" font-style="italic">s<tspan class="sub">t</tspan> = x<tspan class="sub">t</tspan> &#8722; b<tspan class="sub">t</tspan></text>

  <text class="lbl" x="600" y="226" font-size="15px">EMA 平滑</text>
  <text class="lbl" x="600" y="249" font-size="15px" font-style="italic">s&#771;<tspan class="sub">t</tspan></text>
  <text class="lbl" x="600" y="271" font-size="13px">&#964;<tspan class="sub">s</tspan> = 2 s</text>

  <text class="lbl" x="880" y="128" font-size="15px">趋势估计</text>
  <text class="lbl" x="880" y="150" font-size="13px">d<tspan class="sub">t</tspan> (窗口=8)</text>
  <text class="lbl" x="880" y="170" font-size="13px">每步平均斜率</text>

  <text class="lbl" x="880" y="328" font-size="15px">一阶响应反推</text>
  <text class="lbl" x="880" y="351" font-size="15px" font-style="italic">u&#770;<tspan class="sub">t</tspan></text>
  <text class="lbl" x="880" y="373" font-size="13px">&#964;<tspan class="sub">r</tspan> = 2 s</text>

  <text class="lbl" x="1140" y="210" font-weight="bold" font-size="16px">归一化</text>
  <text class="lbl" x="1140" y="232" font-weight="bold" font-size="16px">+ 裁剪</text>
  <text class="lbl" x="1140" y="270" font-size="14px">&#247; scale=200</text>
  <text class="lbl" x="1140" y="292" font-size="14px">clip &#177;5</text>

  <text class="lbl" x="1140" y="458" font-weight="bold" font-size="14px">单传感器特征 (4 维)</text>
  <text class="lbl" x="1140" y="486" font-size="15px">[ s&#772;, s&#772;&#771;, d&#772;, u&#772;&#770; ]</text>

  <text class="lbl" x="360" y="415" font-size="14px">基线更新门控（条件冻结）</text>
  <text class="lbl" x="360" y="440" font-size="13px">仅当 |s&#772;&#771;| &#8804; 0.2 且 |d&#772;| &#8804; 0.05</text>
  <text class="lbl" x="360" y="465" font-size="13px">b<tspan class="sub">t+1</tspan> = &#945;b<tspan class="sub">t</tspan> + (1&#8722;&#945;)x<tspan class="sub">t</tspan>,  &#964;<tspan class="sub">b</tspan> = 180 s</text>

  <!-- ===================== 面板 B ===================== -->
  <text x="24" y="630" class="title">(b) 左右双传感器融合与 PPO 观测构造</text>

  <!-- 旁路（左右特征直连观测） -->
  <path class="byp" d="M270,725 C520,650 950,650 1090,775" marker-end="url(#arrowG)"/>
  <path class="byp" d="M270,931 C520,985 950,985 1090,835" marker-end="url(#arrowG)"/>
  <text x="660" y="668" class="small">左/右特征旁路直连观测</text>

  <!-- 融合箭头（从左右传感器框边缘出发） -->
  <path class="flow" d="M270,743 C430,760 560,798 638,803" marker-end="url(#arrow)"/>
  <path class="flow" d="M270,913 C430,896 560,812 638,807" marker-end="url(#arrow)"/>
  <path class="flow" d="M845,805 L1080,805" marker-end="url(#arrow)"/>

  <!-- 方框 -->
  <rect class="box" x="80"  y="700" width="190" height="86"  fill="#E8EEF6" stroke="#3B6EA5"/>
  <rect class="box" x="80"  y="870" width="190" height="86"  fill="#E8EEF6" stroke="#3B6EA5"/>
  <rect class="box" x="640" y="745" width="205" height="120" fill="#FBF0DC" stroke="#C9952B"/>
  <rect class="box" x="1080" y="745" width="230" height="120" fill="#E7E4F2" stroke="#6A55A0"/>

  <text class="lbl" x="175" y="730" font-size="15px">左 MQ-3</text>
  <text class="lbl" x="175" y="752" font-size="13px">预处理链 (a)</text>
  <text class="lbl" x="175" y="774" font-size="13px">&#8594; 特征 (4 维)</text>

  <text class="lbl" x="175" y="900" font-size="15px">右 MQ-3</text>
  <text class="lbl" x="175" y="922" font-size="13px">预处理链 (a)</text>
  <text class="lbl" x="175" y="944" font-size="13px">&#8594; 特征 (4 维)</text>

  <text class="lbl" x="742" y="778" font-size="14px">差分特征 (4 维)</text>
  <text class="lbl" x="742" y="802" font-size="14px">&#916;s&#772;, &#916;s&#772;&#771;,</text>
  <text class="lbl" x="742" y="826" font-size="14px">&#916;d&#772;, &#916;u&#772;&#770;</text>
  <text class="lbl" x="742" y="850" font-size="13px">(左 &#8722; 右)</text>

  <text class="lbl" x="1195" y="788" font-weight="bold" font-size="15px">PPO 观测向量 (12 维)</text>
  <text class="lbl" x="1195" y="814" font-weight="bold" font-size="14px">左特征 (4) + 右特征 (4)</text>
  <text class="lbl" x="1195" y="838" font-weight="bold" font-size="14px">+ 差分特征 (4)</text>
</svg>
